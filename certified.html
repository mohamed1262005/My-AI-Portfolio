<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>الشهادات المعتمدة | المهندس محمد سامح</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3013d5',
                        secondary: '#1d4ed8',
                        accent: '#1b14de',
                        success: '#10b981',
                    },
                    fontFamily: { sans: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(37, 99, 235, 0.15);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.08);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: #3013d5;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.15);
        }
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(37, 99, 235, 0.15);
            z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 50px;
        }
        .nav-logo {
            font-weight: 800; font-size: 1.2rem;
            background: linear-gradient(135deg, #3013d5 0%, #1b14de 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { text-decoration: none; color: #475569; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #3013d5; }
        @media (max-width: 768px) {
            .navbar { padding: 12px 20px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body class="pt-24 pb-16 px-4">

    <nav class="navbar">
        <div class="nav-logo">محمد سامح</div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="index.html#about">من أنا</a></li>
            <li><a href="index.html#projects">المشاريع</a></li>
            <li><a href="certificates.html" style="color: #3013d5;">الشهادات</a></li>
            <li><a href="index.html#contact">تواصل معي</a></li>
        </ul>
    </nav>

    <div class="max-w-7xl mx-auto pt-10">
        <div class="text-center mb-12">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-3">الشهادات والاعتمادات الرسمية</h1>
            <p class="text-slate-600 max-w-xl mx-auto text-sm sm:text-base">استعرض شهاداتي المهنية المعتمدة في الذكاء الاصطناعي والحوسبة السحابية.</p>
        </div>

        <div class="mb-10 flex justify-center">
            <div class="relative w-full max-w-md">
                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="live-search" placeholder="ابحث عن شهادة (AWS, Machine Learning...)" class="w-full pr-11 pl-4 py-3 rounded-xl glass-card text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#3013d5] text-sm">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cert-grid"></div>

        <div id="no-results" class="hidden text-center py-20">
            <i class="fa-solid fa-folder-open text-4xl text-slate-400 mb-4"></i>
            <p class="text-slate-500 text-lg">لم يتم العثور على شهادات مطابقة.</p>
        </div>
    </div>

    <div id="cert-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="glass-card max-w-3xl w-full rounded-2xl p-6 sm:p-8 relative shadow-2xl bg-white">
            <button onclick="closeModal()" class="absolute top-6 left-6 w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 transition-all">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <span id="modal-id" class="text-xs font-mono text-slate-500">ID: 00000</span>
            <h3 id="modal-title" class="text-2xl font-extrabold text-slate-900 mt-1 mb-2">العنوان</h3>
            <p id="modal-issuer" class="text-xs font-mono text-[#3013d5] mb-6">الجهة الاصدار • التاريخ</p>

            <div class="h-64 sm:h-80 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-center relative mb-6 overflow-hidden p-2">
                <img id="modal-cert-img" src="" alt="معاينة الشهادة" class="w-full h-full object-contain">
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4">
                <a id="modal-verify-btn" href="#" target="_blank" class="px-6 py-3 rounded-xl bg-[#3013d5] text-white font-bold text-xs uppercase tracking-wider transition-all hover:bg-[#1d4ed8] flex items-center gap-2">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> التحقق من الشهادة الرسمية
                </a>
                <button onclick="closeModal()" class="px-6 py-3 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-xs transition-all">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <script>
        const certificates = [
            {
                title: "AWS Certified Machine Learning Engineer – Associate",
                issuer: "Amazon Web Services (AWS)",
                year: "23 يوليو 2026",
                id: "f24ad9a4ade446d382472e7ebf3b90cf",
                link: "https://www.credly.com/badges/e9159743-a509-4331-ab97-74124c206cc1/public_url",
                img: "assets/Certified Machine.png"
            },
            {
                title: "AWS Certified Solutions Architect – Associate",
                issuer: "Amazon Web Services (AWS)",
                year: "24 يوليو 2026",
                id: "567aabd0-b832-4dad-9835-1b4661632a44",
                link: "https://credly.com/badges/567aabd0-b832-4dad-9835-1b4661632a44",
                img: "assets/Certified_Solutions.png"
            },
            {
                title: "AWS: Becoming a Machine Learning Engineer",
                issuer: "Manara / AWS",
                year: "2026/06/22",
                id: "manara-ml-2026",
                link: "https://app.manara.tech/certificate/1782159034-C70FDE8A6E8BEEB2",
                img: "assets/manara_machin.png"
            },
            {
                title: "ITIDA Gigs Freelance Training Program",
                issuer: "ITIDA",
                year: "2026/01/08",
                id: "KSH_GAI25_S1_88271",
                link: "https://drive.google.com/file/d/1dPN_iUJ9MxAMAemprfhhNs_CON874rfp/view",
                img: "assets/ITIDA.png"
            },
            {
                title: "AWS: Becoming a Solutions Architect",
                issuer: "Manara / AWS",
                year: "2026/07/05",
                id: "manara-sa-2026",
                link: "https://app.manara.tech/certificate/1783514592-8D57974D63FC8CDA",
                img: "assets/manara_sol.png"
            },
            {
                title: "One Million Prompters Initiative Certificate",
                issuer: "Dubai Future Foundation",
                year: "2026",
                id: "DFF-1M-AI",
                link: "https://omp.dub.ai/certificate/D0GYYUF2l3zL",
                img: "assets/certificate.png"
            }
        ];

        function renderCertificates(query = '') {
            const grid = document.getElementById('cert-grid');
            const noRes = document.getElementById('no-results');
            grid.innerHTML = '';

            const filtered = certificates.filter(c => 
                c.title.toLowerCase().includes(query) || 
                c.issuer.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                noRes.classList.remove('hidden');
                return;
            } else {
                noRes.classList.add('hidden');
            }

            filtered.forEach(cert => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-5 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-extrabold bg-emerald-100 text-emerald-700 flex items-center gap-1">
                                <i class="fa-solid fa-circle-check text-[10px]"></i> معتمدة
                            </span>
                            <span class="text-xs text-slate-500 font-mono">${cert.year}</span>
                        </div>
                        <div class="h-40 bg-slate-50 rounded-xl mb-4 overflow-hidden flex items-center justify-center border border-slate-100 p-2">
                            <img src="${cert.img}" alt="${cert.title}" class="w-full h-full object-contain hover:scale-105 transition-transform duration-300">
                        </div>
                        <h3 class="font-bold text-slate-900 mb-1 text-base">${cert.title}</h3>
                        <p class="text-xs text-slate-500 mb-4 font-mono">الجهة: ${cert.issuer}</p>
                    </div>
                    <button onclick="openModal('${encodeURIComponent(cert.title)}', '${encodeURIComponent(cert.issuer)}', '${cert.year}', '${cert.id}', '${cert.link}', '${cert.img}')" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-[#3013d5] hover:text-white text-slate-800 font-bold text-xs transition-all flex items-center justify-center gap-2 border border-slate-200">
                        <i class="fa-solid fa-eye"></i> عرض الشهادة
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        renderCertificates();

        document.getElementById('live-search').addEventListener('input', (e) => {
            renderCertificates(e.target.value.toLowerCase().trim());
        });

        function openModal(title, issuer, year, id, link, img) {
            document.getElementById('modal-title').innerText = decodeURIComponent(title);
            document.getElementById('modal-issuer').innerText = `إصدار: ${decodeURIComponent(issuer)} • ${year}`;
            document.getElementById('modal-id').innerText = `ID: ${id}`;
            document.getElementById('modal-verify-btn').setAttribute('href', link);
            document.getElementById('modal-cert-img').setAttribute('src', img);
            document.getElementById('cert-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('cert-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
